# Конфиг для production. Запускается отдельным сервисом перед docker-compose,
# либо как внешний reverse proxy (рекомендуется Caddy с авто-SSL).

server {
    listen 80;
    server_name _;

    # Без ограничения размера загружаемых файлов
    client_max_body_size 0;
    client_body_buffer_size 1m;

    # Frontend (Nuxt SSR)
    location / {
        proxy_pass http://frontend:2026;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API
    location /api/ {
        proxy_pass http://api:2020;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Внутренний location для X-Accel-Redirect от API.
    # API возвращает заголовок: X-Accel-Redirect: /protected/books/123/file.pdf
    # Nginx отдаёт файл из /var/library/books/123/file.pdf напрямую.
    location /protected/ {
        internal;
        alias /var/library/;
        add_header Content-Disposition "inline";
    }
}
