# ===== HTTP =====
# Если в .env включён HTTPS — этот блок редиректит на 443.
# По умолчанию работает на 80 (для офлайн-сети без TLS).

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Закомментируй redirect ниже, если SSL не используется.
    # return 301 https://$host$request_uri;

    # === Защищённая отдача файлов через X-Accel-Redirect ===
    # API проверяет права + инкрементит счётчик и отвечает заголовком
    # X-Accel-Redirect: /protected/books/123/file.pdf — nginx читает его
    # с диска хоста и стримит клиенту.
    location /protected/ {
        internal;
        alias /var/library/;
        # Отдаём как поток, без буферизации в памяти
        sendfile on;
        tcp_nopush on;
        aio threads;
    }

    # === Backend API ===
    location /api/ {
        proxy_pass http://api:2020/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Загрузка больших книг — без лимита
        client_max_body_size 0;
        proxy_request_buffering off;
    }

    # === Nuxt SSR ===
    location / {
        proxy_pass http://frontend:2026;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # === Healthcheck ===
    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}

